[project]
name = "flet-notifications"
version = "0.1.3"
description = "Cross-platform local notifications for Flet apps (Android, iOS, macOS, Windows, Linux, Web)."
readme = "README.md"
authors = [
    { name = "Onyeka Nwokike", email = "nwokikeonyeka@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["flet", "notifications", "desktop", "android", "ios", "cross-platform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]
dependencies = [
    "flet",
]

[project.urls]
Homepage = "https://github.com/Nwokike/flet-notifications"
Repository = "https://github.com/Nwokike/flet-notifications"
Issues = "https://github.com/Nwokike/flet-notifications/issues"

[project.scripts]
flet-notifications-patch = "flet_notifications.patcher:main"

[tool.setuptools.package-data]
"flutter.flet_notifications" = ["pubspec.yaml", "lib/**"]

[tool.setuptools]
license-files = ["LICENSE"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
# Match the flet core source style: Optional[...] and quoted forward
# references in control/event annotations.
ignore = ["UP045", "UP037"]
